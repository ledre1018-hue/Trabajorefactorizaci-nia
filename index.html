<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoApp - Sistema de Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-principal">
    <h2>RestoApp - Mesero V2.0</h2>

    <form id="form-pedido">
      <div class="item">
        <label for="select-menu">Plato</label>
        <select id="select-menu" required>
          <option value="">--Cargando menú--</option>
        </select>
      </div>

      <div class="item">
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" min="1" value="1" required>
      </div>

      <div class="item">
        <label for="precio">Precio unitario ($)</label>
        <input type="number" id="precio" readonly>
      </div>

      <button type="submit" id="btn-procesar">PROCESAR PEDIDO</button>
    </form>

    <div id="res" role="status" aria-live="polite"></div>

    <div class="nav-link">
      <a href="admin.html">Ir al Panel de Administración</a>
    </div>
  </div>

  <script type="module">
    import { obtenerMenu } from "./js/menu.js";
    import { calcularTotales, formatearMoneda } from "./js/pedido.js";

    let menuCache = {};

    const form = document.getElementById('form-pedido');
    const selectMenu = document.getElementById('select-menu');
    const inputCantidad = document.getElementById('cantidad');
    const inputPrecio = document.getElementById('precio');
    const btnProcesar = document.getElementById('btn-procesar');
    const divRes = document.getElementById('res');

    function mostrarMensaje(texto, tipo = 'exito') {
      divRes.textContent = texto;
      divRes.classList.remove('mensaje-error', 'mensaje-exito');
      divRes.classList.add(tipo === 'error' ? 'mensaje-error' : 'mensaje-exito');
    }

    async function inicializarMenu() {
      try {
        menuCache = await obtenerMenu();
        const entradas = Object.entries(menuCache);

        if (entradas.length === 0) {
          selectMenu.innerHTML = '<option value="">--No hay platos disponibles--</option>';
          return;
        }

        selectMenu.innerHTML = '<option value="">--Selecciona un plato--</option>';
        entradas.forEach(([id, plato]) => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = `${plato.name} (${formatearMoneda(plato.price)})`;
          selectMenu.appendChild(opt);
        });
      } catch (error) {
        console.error("Error al cargar el menú:", error);
        selectMenu.innerHTML = '<option value="">--Error al cargar el menú--</option>';
        mostrarMensaje('No se pudo cargar el menú. Revisa tu conexión e intenta de nuevo.', 'error');
      }
    }

    selectMenu.addEventListener('change', (evento) => {
      const plato = menuCache[evento.target.value];
      inputPrecio.value = plato ? plato.price : '';
    });

    form.addEventListener('submit', (evento) => {
      evento.preventDefault();

      try {
        const { subtotal, iva, total } = calcularTotales(
          Number(inputCantidad.value),
          Number(inputPrecio.value)
        );

        mostrarMensaje(
          `Pedido procesado — Subtotal: ${formatearMoneda(subtotal)} | ` +
          `IVA (19%): ${formatearMoneda(iva)} | Total: ${formatearMoneda(total)}`
        );
      } catch (error) {
        mostrarMensaje(error.message, 'error');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      btnProcesar.disabled = true;
      inicializarMenu().finally(() => { btnProcesar.disabled = false; });
    });
  </script>
</body>
</html>
